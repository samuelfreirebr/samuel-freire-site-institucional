<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Métricas dos clientes | Painel Samuel Freire</title>
<link rel="icon" href="/img/favicon.png" type="image/png">
<link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles/tokens.css?v=20260909h">
<link rel="stylesheet" href="/styles/base.css?v=20260911a">
<link rel="stylesheet" href="/admin/painel.css?v=20261029i">
<link rel="stylesheet" href="/admin/casca.css?v=20261029i">
<script type="module" src="/admin/casca.js?v=20261110a"></script>
<link rel="stylesheet" href="./metricas.css?v=20261111a">
<script type="module" src="./metricas.js?v=20261111a"></script>
</head>
<body>

<header class="topo">
  <h1><a href="/admin/">Painel</a> <i>Samuel Freire</i><span class="sec">Métricas dos clientes</span></h1>
</header>

<p class="aviso" id="aviso" role="status"></p>

<main class="mt-raiz">
  <div class="mt-barra">
    <select id="site" aria-label="Site"></select>
    <div class="grupo" id="periodo" role="tablist" aria-label="Período">
      <button type="button" data-dias="7">7 dias</button>
      <button type="button" data-dias="15" aria-selected="true">15 dias</button>
      <button type="button" data-dias="30">30 dias</button>
      <button type="button" data-dias="90">90 dias</button>
    </div>
    <div class="grupo" id="idioma" role="tablist" aria-label="Idioma do relatório">
      <button type="button" data-lingua="pt" aria-selected="true">PT</button>
      <button type="button" data-lingua="en">EN</button>
    </div>
    <span class="mt-barra__fim">
      <button class="mini" type="button" id="sincronizar">Sincronizar</button>
      <button class="mini" type="button" id="pdf">Exportar PDF</button>
      <button class="mini" type="button" id="abrir-sites">Sites</button>
    </span>
  </div>

  <article class="mt-rel" id="relatorio"><p class="mt-vazio">Carregando…</p></article>
</main>

<dialog id="jan" class="mt-jan" aria-labelledby="jan-titulo">
  <header class="mt-jan__topo">
    <p id="jan-titulo"><b>Sites medidos</b></p>
    <button type="button" class="mini" id="jan-fechar">Fechar</button>
  </header>
  <div class="mt-jan__corpo">
    <ul class="mt-sites" id="lista-sites"></ul>
    <form id="form-site" class="mt-form">
      <p class="mt-form__titulo">Cadastrar ou atualizar site</p>
      <label>Nome do cliente <input name="nome" required maxlength="120" placeholder="Chief Pavers"></label>
      <label>Código (só letras minúsculas, números e hífen) <input name="id" required pattern="[a-z0-9][a-z0-9-]{1,40}" placeholder="chief-pavers"></label>
      <label>Domínios, separados por vírgula <input name="dominios" required placeholder="chiefpavers.com, chiefpavers.vercel.app"></label>
      <button class="mini mini--ativo" type="submit">Salvar site</button>
    </form>
    <div id="codigo" hidden>
      <p class="mt-form__titulo">Cole no &lt;head&gt; de todas as páginas do site</p>
      <pre class="mt-codigo" id="codigo-texto"></pre>
      <button class="mini" type="button" id="copiar">Copiar código</button>
    </div>
  </div>
</dialog>

</body>
</html>
